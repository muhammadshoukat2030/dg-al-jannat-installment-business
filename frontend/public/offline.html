<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Installment Management System</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #F7F5FF;
        color: #211B3A;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      .card {
        background: #FFFFFF;
        border: 1px solid #E7E1F2;
        padding: 2.5rem 2rem;
        border-radius: 1rem;
        max-width: 420px;
        box-shadow: 0 4px 12px rgba(108, 76, 241, 0.08);
      }
      .badge {
        display: inline-block;
        padding: 0.35rem 0.85rem;
        background-color: #EEE9FF;
        color: #6C4CF1;
        font-weight: 600;
        font-size: 0.85rem;
        border-radius: 9999px;
        margin-bottom: 1.25rem;
      }
      h1 {
        font-size: 1.35rem;
        margin: 0 0 0.75rem 0;
        color: #211B3A;
      }
      p {
        font-size: 0.95rem;
        color: #756F86;
        line-height: 1.5;
        margin: 0 0 1.5rem 0;
      }
      .btn {
        display: inline-block;
        background-color: #6C4CF1;
        color: #FFFFFF;
        padding: 0.75rem 1.5rem;
        border-radius: 0.75rem;
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        border: none;
        box-shadow: 0 2px 6px rgba(108, 76, 241, 0.25);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">Offline Mode Available</div>
      <h1>Installment Management System</h1>
      <p>
        You are currently offline. Your cached records, customers, and pending transactions are securely saved locally in IndexedDB.
      </p>
      <button class="btn" onclick="window.location.reload()">Retry Connection</button>
    </div>
  </body>
</html>
